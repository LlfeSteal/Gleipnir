name: gleipnir

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gleipnir-backend
    # Optional, so that the demo overlay (docker-compose.demo.yml) runs without any .env.
    env_file:
      - path: .env
        required: false
    environment:
      # Decides which iteration is the current one. Interpolated from the shell, then from
      # .env: the shell wins.
      TZ: ${TZ:-Europe/Paris}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # The backend writes nothing to disk and needs no capability.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gleipnir-frontend
    ports:
      - "${GLEIPNIR_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # nginx-unprivileged listens on 8080 as uid 101: no capability needed.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
